name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Display Python version
      run: python -c "import sys; print(sys.version)"

    - name: Install pip and upgrade
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Install runtime dependencies
      run: |
        pip install flask>=3.0 waitress>=3.0 requests>=2.31 pillow>=10.0 pywebview>=5.0

    - name: Install build dependencies
      run: |
        pip install pyinstaller>=6.0

    - name: Build executable
      run: |
        python -u build_windows.py 2>&1

    - name: Check build output
      if: always()
      shell: pwsh
      run: |
        Write-Host "=== Checking dist directory ===" -ForegroundColor Green
        if (Test-Path "dist\Homeflix") {
          Write-Host "dist\Homeflix exists" -ForegroundColor Green
          Get-ChildItem -Path "dist\Homeflix" -Recurse | Select-Object FullName
        } else {
          Write-Host "dist\Homeflix NOT found" -ForegroundColor Red
        }
        if (Test-Path "dist") {
          Write-Host "dist exists" -ForegroundColor Green
          Get-ChildItem -Path "dist"
        } else {
          Write-Host "dist NOT found" -ForegroundColor Red
        }

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        files: |
          dist/Homeflix/Homeflix.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Android TV APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Homeflix sunucu adresi (örn. http://192.168.1.50:5000)"
        required: false
        default: "http://192.168.1.100:5000"
  push:
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK derle
        working-directory: android-tv
        env:
          SERVER_URL: ${{ inputs.server_url || 'http://192.168.1.100:5000' }}
        run: gradle assembleDebug -PserverUrl="$SERVER_URL" --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: homeflix-tv-apk
          path: android-tv/app/build/outputs/apk/debug/*.apk

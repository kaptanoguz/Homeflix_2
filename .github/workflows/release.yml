name: Release

# Builds Homeflix for Windows, macOS (Apple Silicon + Intel) and Linux.
# Pushing a v* tag publishes a GitHub release with all packages; pull requests only build them.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/release.yml'
      - 'app.py'
      - 'homeflix/config.py'
      - 'requirements*.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      HOMEFLIX_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pywebview needs GTK/Qt on Linux, which can't be bundled reliably: the Linux build opens the browser instead.
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask waitress requests pillow pyinstaller
          if [ "$RUNNER_OS" != "Linux" ]; then python -m pip install pywebview; fi

      - name: Build
        run: |
          python packaging/make_icon.py build/icons
          pyinstaller --noconfirm --clean packaging/homeflix-desktop.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          cp dist/Homeflix.exe "out/Homeflix-$HOMEFLIX_VERSION-${{ matrix.target }}.exe"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmg
          # Ad-hoc signature so Apple Silicon runs the bundle; it is not notarized.
          codesign --force --deep --sign - dist/Homeflix.app
          cp -R dist/Homeflix.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Homeflix -srcfolder dmg -ov -format UDZO \
            "out/Homeflix-$HOMEFLIX_VERSION-${{ matrix.target }}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="Homeflix-$HOMEFLIX_VERSION-${{ matrix.target }}"
          mkdir -p "pkg/$name" out
          cp -R dist/Homeflix "pkg/$name/"
          cp build/icons/homeflix-256.png "pkg/$name/homeflix.png"
          cp packaging/install-linux.sh "pkg/$name/install.sh"
          tar -C pkg -czf "out/$name.tar.gz" "$name"

      - name: Smoke test
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) bin=dist/Homeflix.exe ;;
            macOS)   bin=dist/Homeflix.app/Contents/MacOS/Homeflix ;;
            Linux)   bin=dist/Homeflix/Homeflix ;;
          esac
          export HOMEFLIX_DATA_DIR="$RUNNER_TEMP/homeflix-data" HOMEFLIX_PORT=5077
          "$bin" --headless > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5077/ -o /dev/null; then echo "server answered after ${i}s"; ok=1; break; fi
            sleep 1
          done
          cat server.log
          kill %1 || true
          [ -n "$ok" ]

      - uses: actions/upload-artifact@v4
        with:
          name: homeflix-${{ matrix.target }}
          path: out/*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release notes
        run: sed "s/__VERSION__/${GITHUB_REF_NAME}/g" packaging/release-notes.md > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Homeflix ${{ github.ref_name }} — Windows, macOS ve Linux
          body_path: notes.md
          files: out/*
          make_latest: 'true'
